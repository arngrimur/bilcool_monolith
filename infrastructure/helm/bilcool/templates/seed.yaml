apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-users
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  users.csv: |
    username,email,role
    admin,arngrimurbjarnason@gmail.com,admin
  seed-users.sh: |
    #!/bin/sh
    set -e

    SEED_FILE="/seed/users.csv"

    tail -n +2 "$SEED_FILE" | while IFS=',' read -r username email role; do
      [ -z "$username" ] && continue

      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
        INSERT INTO users (username, email, role_id)
        SELECT '$username', '$email', r.id
        FROM roles r WHERE r.name = '$role'
        ON CONFLICT (email) DO NOTHING;
      "

      user_ref=$(psql "$DATABASE_URL" -t -A -c "SELECT user_ref FROM users WHERE email = '$email'")

      echo "Seeded user: $username ($email) as $role (user_ref: $user_ref)"

      if [ -n "$BOOKINGS_DATABASE_URL" ] && [ -n "$user_ref" ]; then
        psql "$BOOKINGS_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
          INSERT INTO users (userref) VALUES ('$user_ref') ON CONFLICT DO NOTHING;
        "
        echo "  -> added to bookings.users"
      fi

      if [ -n "$JOURNAL_DATABASE_URL" ] && [ -n "$user_ref" ]; then
        psql "$JOURNAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
          INSERT INTO users (user_ref, created_at) VALUES ('$user_ref', NOW()) ON CONFLICT (user_ref) DO NOTHING;
        "
        echo "  -> added to journal.users"
      fi
    done
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-authentication
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-authentication-db
          image: postgres:18
          command:
            - sh
            - -c
            - until pg_isready -h authentication-db -U postgres; do sleep 2; done
        - name: wait-for-bookings-db
          image: postgres:18
          command:
            - sh
            - -c
            - until pg_isready -h bookings-db -U postgres; do sleep 2; done
        - name: wait-for-journal-db
          image: postgres:18
          command:
            - sh
            - -c
            - until pg_isready -h journal-db -U postgres; do sleep 2; done
      containers:
        - name: seed
          image: postgres:18
          command: ["/bin/sh", "/seed/seed-users.sh"]
          env:
            - name: DATABASE_URL
              value: postgres://postgres:postgres@authentication-db:5432/authentication?sslmode=disable
            - name: BOOKINGS_DATABASE_URL
              value: postgres://postgres:postgres@bookings-db:5432/bookings?sslmode=disable
            - name: JOURNAL_DATABASE_URL
              value: postgres://postgres:postgres@journal-db:5432/journal?sslmode=disable
          volumeMounts:
            - name: seed
              mountPath: /seed
      volumes:
        - name: seed
          configMap:
            name: seed-users
