name: Release

on:
  push:
    tags:
      - "[0-9]+"
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main

jobs:
  release:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          accessToken: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate bookings image tags
        id: meta-bookings
        uses: docker/metadata-action@v5
        with:
          images: arngrimur/bilcool-bookings
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Generate authentication image tags
        id: meta-authentication
        uses: docker/metadata-action@v5
        with:
          images: arngrimur/bilcool-authentication
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push bookings
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bookings/Dockerfile
          push: true
          tags: ${{ steps.meta-bookings.outputs.tags }}
          labels: ${{ steps.meta-bookings.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push authentication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: authentication/Dockerfile
          push: true
          tags: ${{ steps.meta-authentication.outputs.tags }}
          labels: ${{ steps.meta-authentication.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
