apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-bookings
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - sh
            - -c
            - until pg_isready -h bookings-db -U postgres; do sleep 2; done
      containers:
        - name: migrate
          image: arngrimur/bilcool-bookings-migrate:{{ .Values.image.tag | default .Chart.AppVersion }}
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              value: postgres://postgres:postgres@bookings-db:5432/bookings?sslmode=disable
---
