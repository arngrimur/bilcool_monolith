apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
data:
  init-aws.sh: |
    #!/bin/bash
    set -ex
    REGION=(--region eu-north-1)
    SLEEP_TIME=10
    DLQ=dlq.json
    FILE="file://${DLQ}"

    function attributes() {
      cat > "$DLQ" <<EOF
    {"RedrivePolicy":"{\"deadLetterTargetArn\":\"$1\",\"maxReceiveCount\":\"5\"}"}
    EOF
    }

    function QueueArn() {
      awslocal --region eu-north-1 sqs get-queue-attributes --queue-url "$1" --attribute QueueArn --query 'Attributes.QueueArn' --output text
    }

    # SNS topics
    USERS_TOPIC=$(awslocal "${REGION[@]}" sns create-topic --name bilcool_users --query 'TopicArn' --output text)
    BOOKINGS_TOPIC=$(awslocal "${REGION[@]}" sns create-topic --name bilcool_bookings --query 'TopicArn' --output text)

    # event-ledger SQS
    LEDGER_DLQ=$(awslocal "${REGION[@]}" sqs --output text create-queue --queue-name bilcool-monolith-event_ledger_dlq)
    attributes "$(QueueArn "$LEDGER_DLQ")"
    EVENT_LEDGER_SQS=$(awslocal "${REGION[@]}" sqs --output text create-queue --queue-name bilcool-monolith-event_ledger --attributes "$FILE")
    awslocal "${REGION[@]}" sns subscribe --topic-arn "${USERS_TOPIC}" --protocol sqs --notification-endpoint "$(QueueArn "$EVENT_LEDGER_SQS")"
    awslocal "${REGION[@]}" sns subscribe --topic-arn "${BOOKINGS_TOPIC}" --protocol sqs --notification-endpoint "$(QueueArn "$EVENT_LEDGER_SQS")"

    # bookings SQS
    BOOKINGS_DLQ=$(awslocal "${REGION[@]}" sqs --output text create-queue --queue-name bilcool-monolith-bookings_dlq)
    attributes "$(QueueArn "$BOOKINGS_DLQ")"
    BOOKINGS_SQS=$(awslocal "${REGION[@]}" sqs --output text create-queue --queue-name bilcool-monolith-bookings --attributes "$FILE")
    awslocal "${REGION[@]}" sns subscribe --topic-arn "${USERS_TOPIC}" --protocol sqs --notification-endpoint "$(QueueArn "$BOOKINGS_SQS")"

    # journal SQS
    JOURNAL_DLQ=$(awslocal "${REGION[@]}" sqs --output text create-queue --queue-name bilcool-monolith-journal_dlq)
    attributes "$(QueueArn "$JOURNAL_DLQ")"
    JOURNAL_SQS=$(awslocal "${REGION[@]}" sqs --output text create-queue --queue-name bilcool-monolith-journal --attributes "$FILE")
    awslocal "${REGION[@]}" sns subscribe --topic-arn "${USERS_TOPIC}" --protocol sqs --notification-endpoint "$(QueueArn "$JOURNAL_SQS")"
    awslocal "${REGION[@]}" sns subscribe --topic-arn "${BOOKINGS_TOPIC}" --protocol sqs --notification-endpoint "$(QueueArn "$JOURNAL_SQS")"

    # DynamoDB table for event-ledger
    awslocal "${REGION[@]}" dynamodb create-table \
      --table-name event-ledger \
      --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
      --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
      --billing-mode PAY_PER_REQUEST
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:2026.3.0
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: sns,sqs,s3,dynamodb
            - name: DEFAULT_REGION
              value: eu-north-1
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: localstack
                  key: LOCALSTACK_AUTH_TOKEN
          readinessProbe:
            httpGet:
              path: /_localstack/init/ready
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: init-script
              mountPath: /etc/localstack/init/ready.d/init-aws.sh
              subPath: init-aws.sh
      volumes:
        - name: init-script
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
