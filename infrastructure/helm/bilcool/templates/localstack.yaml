{{- if .Values.localstack.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
data:
  init-aws.sh: |
{{ .Files.Get "files/init-aws.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
      annotations:
        # the token Secret is a hook; restart LocalStack when it or the init script changes
        checksum/config: {{ list .Values.secrets.localstackAuthToken (.Files.Get "files/init-aws.sh") | toJson | sha256sum }}
    spec:
      containers:
        - name: localstack
          image: {{ .Values.localstack.image }}
          ports:
            - containerPort: 4566
          envFrom:
            - secretRef:
                name: localstack
                optional: true
          env:
            - name: SERVICES
              value: sns,sqs,s3,dynamodb
            - name: DEFAULT_REGION
              value: {{ .Values.config.awsRegion }}
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
          readinessProbe:
            httpGet:
              path: /_localstack/init/ready
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: init-script
              mountPath: /etc/localstack/init/ready.d/init-aws.sh
              subPath: init-aws.sh
      volumes:
        - name: init-script
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
{{- end }}
