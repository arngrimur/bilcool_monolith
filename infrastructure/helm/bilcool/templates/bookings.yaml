apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookings
  labels:
    app: bookings
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookings
  template:
    metadata:
      name: bookings
      labels:
        app: bookings
    spec:
      initContainers:
        - name: wait-for-localstack
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://localstack:4566/_localstack/init/ready | grep -q SUCCESSFUL; do
                echo "Waiting for LocalStack init to complete..."; sleep 3;
              done
      containers:
        - name: bookings
          image: arngrimur/bilcool-bookings:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bilcool-shared
            - secretRef:
                name: bookings
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: bookings
spec:
  selector:
    app: bookings
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort
