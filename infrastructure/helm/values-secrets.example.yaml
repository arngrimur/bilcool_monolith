# cp values-secrets.example.yaml values-secrets.yaml   (values-secrets.yaml is gitignored; never commit it)
# Dev only needs the values that cannot have a sensible default:
secrets:
  # Required in dev: LocalStack 2026.x refuses to start without an auth token (free account at app.localstack.cloud).
  localstackAuthToken: ""
  authentication:
    jwtSecret: "change-me"
    # Only needed with mailSender: brevo (prod). Dev uses mailSender: log and needs no key.
    brevoApiKey: ""
# Prod (HELM_VALUES_SECRETS in CI) additionally sets awsAccessKeyId/awsSecretAccessKey and the three
# secrets.<service>.databaseUrl values, see ../README.md.
