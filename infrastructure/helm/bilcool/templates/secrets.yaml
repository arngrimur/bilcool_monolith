{{- /* Secrets are pre-install hooks (weight -10) because the migrate/seed hook Jobs read them. */}}
{{- $hook := include "bilcool.preHook" "-10" }}
{{- if .Values.localstack.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: localstack
  annotations:
    {{- $hook | nindent 4 }}
type: Opaque
stringData:
  LOCALSTACK_AUTH_TOKEN: {{ required "secrets.localstackAuthToken is required when localstack.enabled (LocalStack 2026.x needs an auth token; put it in values-secrets.yaml)" .Values.secrets.localstackAuthToken | quote }}
---
{{- end }}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  annotations:
    {{- $hook | nindent 4 }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ required "secrets.postgres.adminPassword is required when postgres.enabled" .Values.secrets.postgres.adminPassword | quote }}
  PW_BOOKINGS: {{ required "secrets.postgres.passwords.bookings is required" .Values.secrets.postgres.passwords.bookings | quote }}
  PW_AUTHENTICATION: {{ required "secrets.postgres.passwords.authentication is required" .Values.secrets.postgres.passwords.authentication | quote }}
  PW_JOURNAL: {{ required "secrets.postgres.passwords.journal is required" .Values.secrets.postgres.passwords.journal | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: authentication
  annotations:
    {{- $hook | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.authentication.jwtSecret is required" .Values.secrets.authentication.jwtSecret | quote }}
  BREVO_API_KEY: {{ .Values.secrets.authentication.brevoApiKey | quote }}
  DATABASE_URL: {{ include "bilcool.dbUrl" (list . "authentication") | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bookings
  annotations:
    {{- $hook | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "bilcool.dbUrl" (list . "bookings") | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: journal
  annotations:
    {{- $hook | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "bilcool.dbUrl" (list . "journal") | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: event-ledger
  annotations:
    {{- $hook | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
