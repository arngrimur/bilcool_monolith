name: Build

on:
  push:
  pull_request:
    branches: [main]

jobs:
  vendor:
    name: vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Cache vendor directories
        id: cache-vendor
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum', 'bilcool-lib/go.sum') }}
      - name: Vendor dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: task vendor

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./bookings ./message_broker ./testing ./authentication ./event_ledger ./journal
      - run: go work vendor
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: ./...

  build-testing:
    name: testing
    runs-on: ubuntu-latest
    needs: vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: testing/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./testing
      - run: go work vendor
      - run: task testing:build

  build-bilcool-lib:
    name: bilcool-lib
    runs-on: ubuntu-latest
    needs: vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bilcool-lib/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./bilcool-lib
      - run: go work vendor
      - run: task bilcool-lib:build
      - run: task bilcool-lib:test

  build-message-broker:
    name: message_broker
    runs-on: ubuntu-latest
    needs: [vendor, build-testing]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: message_broker/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./message_broker ./testing
      - run: go work vendor
      - run: task message_broker:build
      - run: task message_broker:test
      - run: task message_broker:integration-test

  build-bookings:
    name: bookings
    needs: [vendor, build-testing, build-message-broker, build-bilcool-lib]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bookings/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./bookings ./message_broker ./testing ./authentication ./bilcool-lib
      - run: go work vendor
      - run: task bookings:build
      - run: task bookings:integration-test
    runs-on: ubuntu-latest

  build-authentication:
    name: authentication
    needs: [vendor, build-testing, build-message-broker, build-bilcool-lib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: authentication/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./authentication ./message_broker ./testing ./bilcool-lib
      - run: go work vendor
      - run: task authentication:build
      - run: task authentication:integration-test

  build-event-ledger:
    name: event_ledger
    needs: [vendor, build-testing, build-message-broker, build-bilcool-lib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: event_ledger/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./event_ledger ./message_broker ./testing ./bilcool-lib
      - run: go work vendor
      - run: task event_ledger:build
      - run: task event_ledger:integration-test

  build-journal:
    name: journal
    needs: [vendor, build-testing, build-message-broker, build-bilcool-lib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: journal/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./journal ./message_broker ./bookings ./authentication ./testing ./bilcool-lib
      - run: go work vendor
      - run: task journal:build

  lambda-build:
    name: lambda-build
    needs: [build-bookings, build-authentication, build-event-ledger, build-journal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bookings/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum','bilcool-lib/go.sum') }}
      - name: Initialize workspace
        run: go work init . ./bookings ./authentication ./event_ledger ./journal ./message_broker ./testing ./bilcool-lib
      - run: go work vendor
      - run: task lambda-build-all
      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-zips
          path: dist/*.zip
          retention-days: 7

  lambda-deploy:
    name: lambda-deploy
    needs: [lambda-build]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Upload to S3
        run: aws s3 sync dist/ s3://bilcool-lambda-artifacts/ --region eu-north-1
      - name: Update Lambda functions
        run: |
          BUCKET=bilcool-lambda-artifacts
          REGION=eu-north-1
          PREFIX=bilcool-production
          for fn in \
            bookings-http \
            bookings-sqs \
            bookings-outbox \
            bookings-migrate \
            authentication-http \
            authentication-outbox \
            authentication-migrate \
            event-ledger-http \
            event-ledger-sqs \
            journal-http \
            journal-sqs \
            journal-migrate; do
            aws lambda update-function-code \
              --function-name "${PREFIX}-${fn}" \
              --s3-bucket "${BUCKET}" \
              --s3-key "${fn}.zip" \
              --region "${REGION}" \
              --no-cli-pager
          done
      - name: Invoke migration Lambdas
        run: |
          PREFIX=bilcool-production
          REGION=eu-north-1
          for svc in bookings authentication journal; do
            aws lambda invoke \
              --function-name "${PREFIX}-${svc}-migrate" \
              --region "${REGION}" \
              --no-cli-pager \
              /tmp/${svc}-migrate-result.json
            cat /tmp/${svc}-migrate-result.json
          done

  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
      - name: Terraform init
        run: terraform init -backend=false
        working-directory: infrastructure/production/terraform
      - name: Terraform validate
        run: terraform validate
        working-directory: infrastructure/production/terraform

  build-ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/bilcool-ui/package-lock.json
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install dependencies
        run: npm ci
        working-directory: ui/bilcool-ui
      - run: task ui:build
      - run: task ui:test
      - name: Upload UI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/bilcool-ui/dist/
          retention-days: 7

  ui-deploy:
    name: ui-deploy
    needs: [build-ui]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Sync to S3
        run: aws s3 sync dist/ s3://bilcool-frontend/ --delete --region eu-north-1
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
