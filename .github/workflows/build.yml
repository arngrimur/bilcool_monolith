name: Build

on:
  push:
  pull_request:
    branches: [main]

jobs:
  vendor:
    name: vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Cache vendor directories
        id: cache-vendor
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum') }}
      - name: Vendor dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: task vendor

  build-testing:
    name: testing
    runs-on: ubuntu-latest
    needs: vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: testing/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum') }}
      - name: Initialize workspace
          - run: go work init . ./bookings ./message_broker ./testing
          - run: go work tidy
          - run: go work vendor
          - run: task testing:build

  build-message-broker:
    name: message_broker
    runs-on: ubuntu-latest
    needs: [vendor, build-testing]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: message_broker/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum') }}
      - name: Initialize workspace
          - run: go work init . ./bookings ./message_broker ./testing
          - run: task message_broker:build
          - run: task message_broker:test
          - run: task message_broker:integration-test

  build-bookings:
    name: bookings
    runs-on: ubuntu-latest
    needs: [vendor, build-testing, build-message-broker]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bookings/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum') }}
      - name: Initialize workspace
          - run: go work init . ./bookings ./message_broker ./testing ./authentication
          - run: task bookings:build
          - run: task bookings:integration-test

  build-authentication:
    name: authentication
    runs-on: ubuntu-latest
    needs: [vendor, build-testing, build-message-broker]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: authentication/go.mod
          cache: false
      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest
      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ hashFiles('go.sum', 'testing/go.sum', 'message_broker/go.sum', 'bookings/go.sum') }}
      - name: Initialize workspace
          -  run: go work init . ./authentication ./message_broker ./testing
          - run: task authentication:build
          - run: task authentication:integration-test
