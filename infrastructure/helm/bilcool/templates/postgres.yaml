{{- if .Values.postgres.enabled }}
{{- /* ONE Postgres, database "bilcool". The db-init Job creates a schema + login role per service (like
       infrastructure/frostmoln/bootstrap/bootstrap.sh). Hook resources so they exist before the migrate Jobs;
       they survive `helm uninstall` (use `task helm:down:purge`). */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations:
    {{- include "bilcool.preHook" "-8" | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - -c
            - wal_level=logical
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: bilcool
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: ADMIN_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "bilcool"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  annotations:
    {{- include "bilcool.preHook" "-8" | nindent 4 }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  annotations:
    {{- include "bilcool.preHook" "-4" | nindent 4 }}
data:
  db-init.sh: |
{{ .Files.Get "files/db-init.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    {{- include "bilcool.preHook" "-3" | nindent 4 }}
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: postgres
          env:
            - name: REPLICATION_ROLES
              value: {{ .Values.postgres.replicationRoles | quote }}
          command: ["/bin/sh", "/scripts/db-init.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: db-init
{{- end }}
