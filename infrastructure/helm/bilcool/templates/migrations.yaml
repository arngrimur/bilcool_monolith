{{- if .Values.migrations.enabled }}
{{- range $svc := list "bookings" "authentication" "journal" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ $svc }}
  annotations:
    {{- include "bilcool.preHook" "0" | nindent 4 }}
spec:
  backoffLimit: 20
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: arngrimur/bilcool-{{ $svc }}-migrate:{{ $.Values.image.tag | default "latest" }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 65534
            runAsNonRoot: true
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $svc }}
                  key: DATABASE_URL
---
{{- end }}
{{- end }}
