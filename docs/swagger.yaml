basePath: /api/v1
definitions:
  domain.BookingResponse:
    properties:
      booking_reference:
        type: string
      end_date:
        type: string
      start_date:
        type: string
      user_ref:
        type: string
    required:
    - booking_reference
    - end_date
    - start_date
    - user_ref
    type: object
  web.HTTPError:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: status bad request
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: The REST API for BilCool to book and view bookings and other stuff.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: BilCool REST API
  version: "1.0"
paths:
  /booking:
    get:
      consumes:
      - application/json
      description: get all booking
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.BookingResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.HTTPError'
      summary: Show all bookings
      tags:
      - bookings
  /booking/{id}:
    get:
      consumes:
      - application/json
      description: get booking by booking reference
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.BookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.HTTPError'
      summary: Show a booking
      tags:
      - bookings
securityDefinitions:
  None:
    type: basic
swagger: "2.0"
