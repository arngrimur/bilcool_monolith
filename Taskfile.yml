version: '3'

vars:
  COVERAGE_OUTPUT_DIR: /tmp/coverage
  COVERAGE_OUTPUT_FILE: coverage.out
  COVERAGE_OUTPUT_HTML: coverage.html

tasks:
  helm:up:
    aliases: [up]
    desc: "Helm: start minikube if needed, build and load all images, then install/upgrade the bilcool release (values-dev.yaml)"
    cmds:
      - task: minikube:start
      - task: minikube:build
      - task: minikube:build-migrate
      - task: helm:upgrade

  helm:down:
    aliases: [down]
    desc: "Helm: uninstall the bilcool release. Keeps the Postgres volume and the pre-install hook objects (Secrets, Postgres); see helm:down:purge"
    cmds:
      - helm uninstall bilcool || true

  helm:down:purge:
    aliases: [down:purge]
    desc: "Helm, DESTRUCTIVE: uninstall the release, then delete what helm uninstall leaves behind (Postgres StatefulSet/Service/PVCs, the app Secrets, db-init and seed objects). ALL local database data is lost"
    cmds:
      - helm uninstall bilcool || true
      - kubectl delete statefulset/postgres service/postgres secret/postgres secret/localstack secret/authentication secret/bookings secret/journal secret/event-ledger configmap/db-init configmap/seed-users job/db-init --ignore-not-found
      - kubectl delete pvc -l app=postgres --ignore-not-found
      - kubectl delete pvc data-postgres-0 --ignore-not-found

  bookings_db:
    desc: psql into the bookings schema of the minikube database
    cmd: kubectl exec -it statefulset/postgres -- env PGPASSWORD=dev-bookings psql -h localhost -U bookings -d bilcool

  minikube:start:
    desc: Start minikube if it is not running
    status:
      - minikube status
    cmds:
      - minikube start

  minikube:build-authentication:
    desc: Build authentication image and load into minikube
    deps: [vendor-if-missing]
    cmds:
      - docker build -f authentication/Dockerfile -t arngrimur/bilcool-authentication:latest .
      - minikube image load arngrimur/bilcool-authentication:latest

  minikube:build-bookings:
    desc: Build bookings image and load into minikube
    deps: [vendor-if-missing]
    cmds:
      - docker build -f bookings/Dockerfile -t arngrimur/bilcool-bookings:latest .
      - minikube image load arngrimur/bilcool-bookings:latest

  minikube:build-journal:
    desc: Build journal image and load into minikube
    deps: [vendor-if-missing]
    cmds:
      - docker build -f journal/Dockerfile -t arngrimur/bilcool-journal:latest .
      - minikube image load arngrimur/bilcool-journal:latest

  minikube:build-event-ledger:
    desc: Build event-ledger image and load into minikube
    deps: [vendor-if-missing]
    cmds:
      - docker build -f event_ledger/Dockerfile -t arngrimur/bilcool-event-ledger:latest .
      - minikube image load arngrimur/bilcool-event-ledger:latest

  minikube:build-ui:
    desc: Build UI image and load into minikube
    cmds:
      - docker build -f ui/bilcool-ui/Dockerfile -t arngrimur/bilcool-ui:latest ui/bilcool-ui
      - minikube image load arngrimur/bilcool-ui:latest

  minikube:build-migrate-authentication:
    desc: Build authentication migration image and load into minikube
    cmds:
      - docker build -f authentication/Dockerfile.migrate -t arngrimur/bilcool-authentication-migrate:latest .
      - minikube image load arngrimur/bilcool-authentication-migrate:latest

  minikube:build-migrate-bookings:
    desc: Build bookings migration image and load into minikube
    cmds:
      - docker build -f bookings/Dockerfile.migrate -t arngrimur/bilcool-bookings-migrate:latest .
      - minikube image load arngrimur/bilcool-bookings-migrate:latest

  minikube:build-migrate-journal:
    desc: Build journal migration image and load into minikube
    cmds:
      - docker build -f journal/Dockerfile.migrate -t arngrimur/bilcool-journal-migrate:latest .
      - minikube image load arngrimur/bilcool-journal-migrate:latest

  minikube:build-migrate:
    desc: Build all migration images and load into minikube
    cmds:
      - task: minikube:build-migrate-authentication
      - task: minikube:build-migrate-bookings
      - task: minikube:build-migrate-journal

  minikube:build:
    desc: Build all service images and load into minikube
    cmds:
      - task: minikube:build-authentication
      - task: minikube:build-bookings
      - task: minikube:build-journal
      - task: minikube:build-event-ledger
      - task: minikube:build-ui

  minikube:restart:
    desc: Restart all deployments so they pick up freshly loaded images
    cmds:
      - kubectl rollout restart deployment/bookings deployment/authentication deployment/journal deployment/event-ledger deployment/ui
      - kubectl rollout status deployment/bookings deployment/authentication deployment/journal deployment/event-ledger deployment/ui

    cmds:
      - kubectl rollout restart deployment/bookings deployment/authentication deployment/journal deployment/event-ledger deployment/ui
      - kubectl rollout status deployment/bookings deployment/authentication deployment/journal deployment/event-ledger deployment/ui

  helm:upgrade:
    aliases: [minikube:helm-upgrade]
    desc: "Helm: install/upgrade the bilcool release with values-dev.yaml + values-secrets.yaml, then restart all deployments so freshly loaded :latest images are used"
    preconditions:
      - sh: test -f infrastructure/helm/values-secrets.yaml
        msg: "infrastructure/helm/values-secrets.yaml is missing. Run: cp infrastructure/helm/values-secrets.example.yaml infrastructure/helm/values-secrets.yaml and fill it in."
    cmds:
      - helm upgrade --install bilcool ./infrastructure/helm/bilcool -f infrastructure/helm/values-dev.yaml -f infrastructure/helm/values-secrets.yaml --wait --timeout 10m
          for s in authentication bookings journal; do
            printf '  %s:\n    databaseUrl: "%s"\n' "$s" "$(kubectl get secret "$s" -o jsonpath='{.data.DATABASE_URL}' | base64 -d)"
            if [ "$s" = authentication ]; then
              # Only when set, so a key from values-secrets.yaml is not overridden by an empty one.
              brevo=$(kubectl get secret authentication -o jsonpath='{.data.BREVO_API_KEY}' | base64 -d)
              if [ -n "$brevo" ]; then printf '    brevoApiKey: "%s"\n' "$brevo"; fi
            fi
          done
          printf '  awsAccessKeyId: "%s"\n  awsSecretAccessKey: "%s"\n' \
            "$(kubectl get secret event-ledger -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)" \
            "$(kubectl get secret event-ledger -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
        } >"$f"
        rc=0
        helm upgrade --install bilcool ./infrastructure/helm/bilcool -f infrastructure/helm/values-secrets.yaml -f "$f" \
          --set image.tag=latest --set postgres.location=frostmoln \
          --set config.authentication.webauthnRpId=localhost --set config.authentication.webauthnRpOrigins=http://localhost:3000 || rc=$?
        rm -f "$f"
        exit $rc
      - kubectl rollout restart deployment/bookings deployment/authentication deployment/journal deployment/event-ledger deployment/ui

  minikube:kill-port-forward:
    desc: Kill all active kubectl port-forward processes
    cmds:
      - pkill -f "kubectl port-forward" || true

  minikube:port-forward:
    desc: Port-forward UI, Postgres and LocalStack from minikube to localhost (leftover forwards from an earlier run are killed first)
    cmds:
      - task: minikube:kill-port-forward
      - |
        kubectl port-forward service/ui 3000:80 &
        kubectl port-forward service/postgres 54320:5432 &
        kubectl port-forward service/localstack 4566:4566 &
        wait

  swagger:
    desc: 'Regenerate Swagger/OpenAPI docs (bookings and event_ledger)'
    dir: '{{.USER_WORKING_DIR}}'
    preconditions:
      - test -d bookings
      - go install github.com/swaggo/swag/cmd/swag@latest
    cmd: swag init -g router.go -o docs -d bookings/internal/pkg/web,bookings/internal/pkg/domain,bookings/pkg/domain,event_ledger/internal/pkg/web,event_ledger/internal/pkg/domain --generatedTime --parseDependency --parseInternal

  test:
    desc: Run unit tests in the root module
    dir: '{{.USER_WORKING_DIR}}'
    preconditions:
      - test -f go.mod
    cmds:
      - go generate ./...
      - go test ./...

  integration-test:
    desc: 'Run integration tests in the root module (needs Docker)'
    dir: '{{.USER_WORKING_DIR}}'
    preconditions:
      - test -f go.mod
    cmds:
      - go generate ./...
      - go test -tags=integration ./...

  build:
    desc: Build the root module
    dir: '{{.USER_WORKING_DIR}}'
    preconditions:
      - test -f go.mod
    cmds:
      - go generate ./...
      - go build ./...

  testing:build:
    desc: Build the shared testing module
    dir: testing
    cmds:
      - go generate ./...
      - go build ./...


  authentication:build:
    desc: Build authentication
    dir: authentication
    cmds:
      - go build ./...
      
  authentication:test:
    desc: Run authentication unit tests
    dir: authentication
    cmds:
      - go generate ./...
      - go test ./...

  authentication:integration-test:
    desc: 'Run authentication integration tests (needs Docker)'
    dir: authentication
    cmds:
      - go generate ./...
      - go test -tags=integration ./...

  bilcool-lib:build:
    desc: Build bilcool-lib
    dir: bilcool-lib
    cmds:
      - go build ./...

  bilcool-lib:test:
    desc: Run bilcool-lib unit tests
    dir: bilcool-lib
    cmds:
      - go generate ./...
      - go test ./...

  journal:build:
    desc: Build journal
    dir: journal
    cmds:
      - go build ./...
      -
  journal:test:
    desc: Run journal unit tests
    dir: journal
    cmds:
      - go test ./...

  journal:integration-test:
    desc: 'Run journal integration tests (needs Docker)'
    dir: journal
    cmds:
      - go test -tags=integration ./...


  message_broker:build:
    desc: Build message_broker
    dir: message_broker
    cmds:
      - go build ./...

  message_broker:test:
    desc: Run message_broker unit tests
    dir: message_broker
    cmds:
      - go generate ./...
      - go test ./...

  message_broker:integration-test:
    desc: 'Run message_broker integration tests (needs Docker)'
    dir: message_broker
    cmds:
      - go generate ./...
      - go test -tags=integration ./...

  bookings:build:
    desc: Build bookings
    dir: bookings
    cmds:
      - go build ./...

  bookings:test:
    desc: Run bookings unit tests
    dir: bookings
    cmds:
      - go generate ./...
      - go generate ../message_broker/...
      - go test ./...

  bookings:integration-test:
    desc: 'Run bookings integration tests (needs Docker)'
    dir: bookings
    cmds:
      - go generate ./...
      - go generate ../message_broker/...
      - go test -tags=integration ./...


  event_ledger:build:
    desc: Build event_ledger
    dir: event_ledger
    cmds:
      - go build ./...

  event_ledger:test:
    desc: Run event_ledger unit tests
    dir: event_ledger
    cmds:
      - go generate ./...
      - go generate ../message_broker/...
      - go test ./...

  event_ledger:integration-test:
    desc: 'Run event_ledger integration tests (needs Docker)'
    dir: event_ledger
    cmds:
      - go generate ./...
      - go generate ../message_broker/...
      - go test -tags=integration ./...

  test-all:
    desc: Run unit and integration tests across every module
    cmds:
      - task: testing:build
      - task: message_broker:test
      - task: message_broker:integration-test
      - task: bookings:integration-test
      - task: authentication:test
      - task: authentication:integration-test
      - task: event_ledger:test
      - task: event_ledger:integration-test
      - task: journal:test
      - task: journal:integration-test

  ui:build:
    desc: Build the UI
    dir: ui/bilcool-ui
    preconditions:
      - test -f package.json
    cmds:
      - npm run build

  ui:test:
    desc: Run the UI tests
    dir: ui/bilcool-ui
    preconditions:
      - test -f package.json
    cmds:
      - npm test

  ui:dev:
    desc: 'Start the UI Vite dev server on :3000'
    dir: ui/bilcool-ui
    preconditions:
      - test -f package.json
    cmds:
      - npm run dev

  bookings:lambda-build:
    desc: Build the bookings Lambda zips
    dir: bookings
    cmds:
      - mkdir -p ../dist
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/http && zip -j ../dist/bookings-http.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/sqs && zip -j ../dist/bookings-sqs.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/outbox && zip -j ../dist/bookings-outbox.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/migrate && zip -j ../dist/bookings-migrate.zip bootstrap && rm bootstrap

  authentication:lambda-build:
    desc: Build the authentication Lambda zips
    dir: authentication
    cmds:
      - mkdir -p ../dist
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/http && zip -j ../dist/authentication-http.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/outbox && zip -j ../dist/authentication-outbox.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/migrate && zip -j ../dist/authentication-migrate.zip bootstrap && rm bootstrap

  event_ledger:lambda-build:
    desc: Build the event_ledger Lambda zips
    dir: event_ledger
    cmds:
      - mkdir -p ../dist
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/http && zip -j ../dist/event-ledger-http.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/sqs && zip -j ../dist/event-ledger-sqs.zip bootstrap && rm bootstrap

  journal:lambda-build:
    desc: Build the journal Lambda zips
    dir: journal
    cmds:
      - mkdir -p ../dist
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/http && zip -j ../dist/journal-http.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/sqs && zip -j ../dist/journal-sqs.zip bootstrap && rm bootstrap
      - GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/migrate && zip -j ../dist/journal-migrate.zip bootstrap && rm bootstrap

  lambda-build-all:
    desc: 'Build every Lambda zip (provided.al2023, arm64)'
    cmds:
      - task: bookings:lambda-build
      - task: authentication:lambda-build
      - task: event_ledger:lambda-build
      - task: journal:lambda-build

  # The service Dockerfiles copy go.work and vendor/, which are gitignored. `go work init` fails when go.work
  # exists, so only generate them when missing; run `task vendor` after go.mod changes.
  vendor-if-missing:
    internal: true
    status:
      - test -f go.work
      - test -f vendor/modules.txt
    cmds:
      - task: vendor

  vendor:
    desc: 'Generate go.work for all modules and vendor them (run after go.mod changes; delete go.work and vendor/ first)'
    cmds:
      - go work init . ./bookings ./message_broker ./testing ./authentication ./event_ledger ./journal ./bilcool-lib
      - go work vendor

  coverage-all:
    desc: Generate a merged HTML coverage report in /tmp/coverage
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      BL_UNIT: "{{.COVERAGE_OUTPUT_DIR}}/bilcool_lib.out"
      MB_UNIT: "{{.COVERAGE_OUTPUT_DIR}}/message_broker_unit.out"
      MB_INT: "{{.COVERAGE_OUTPUT_DIR}}/message_broker_int.out"
      EL_UNIT: "{{.COVERAGE_OUTPUT_DIR}}/event_ledger_unit.out"
      EL_INT: "{{.COVERAGE_OUTPUT_DIR}}/event_ledger_int.out"
      JO_UNIT: "{{.COVERAGE_OUTPUT_DIR}}/journal_unit.out"
      JO_INT: "{{.COVERAGE_OUTPUT_DIR}}/journal_int.out"
      BK_INT: "{{.COVERAGE_OUTPUT_DIR}}/bookings_int.out"
      AUTH_UNIT: "{{.COVERAGE_OUTPUT_DIR}}/authentication_unit.out"
      AUTH_INT: "{{.COVERAGE_OUTPUT_DIR}}/authentication_int.out"
      MERGED: "{{.COVERAGE_OUTPUT_DIR}}/{{.COVERAGE_OUTPUT_FILE}}"
      HTML: "{{.COVERAGE_OUTPUT_DIR}}/{{.COVERAGE_OUTPUT_HTML}}"
    cmds:
      - mkdir -p {{.COVERAGE_OUTPUT_DIR}}
      - cd bilcool-lib && go generate ./... && go test -coverprofile={{.BL_UNIT}} -covermode=atomic -coverpkg=./... ./...
      - cd message_broker && go generate ./... && go test -coverprofile={{.MB_UNIT}} -covermode=atomic -coverpkg=./... ./...
      - cd message_broker && go test -tags=integration -coverprofile={{.MB_INT}} -covermode=atomic -coverpkg=./... ./...
      - cd event_ledger && go generate ./... && go test -coverprofile={{.MB_UNIT}} -covermode=atomic -coverpkg=./... ./...
      - cd event_ledger && go test -tags=integration -coverprofile={{.MB_INT}} -covermode=atomic -coverpkg=./... ./...
      - cd bookings && go generate ./... && go test -tags=integration -coverprofile={{.BK_INT}} -covermode=atomic -coverpkg=./... ./...
      - cd authentication && go generate ./... && go test -coverprofile={{.AUTH_UNIT}} -covermode=atomic -coverpkg=./... ./...
      - cd authentication && go generate ./... && go test -tags=integration -coverprofile={{.AUTH_INT}} -covermode=atomic -coverpkg=./... ./...
      - cd journa && go generate ./... && go test -coverprofile={{.JO_UNIT}} -covermode=atomic -coverpkg=./... ./...
      - cd journal && go generate ./... && go test -tags=integration -coverprofile={{.JO_INT}} -covermode=atomic -coverpkg=./... ./...
      - "printf 'mode: atomic\\n' > {{.MERGED}}"
      - "tail -n +2 {{.BL_UNIT}} >> {{.MERGED}}"
      - "tail -n +2 {{.MB_UNIT}} >> {{.MERGED}}"
      - "tail -n +2 {{.MB_INT}} >> {{.MERGED}}"
      - "tail -n +2 {{.BK_INT}} >> {{.MERGED}}"
      - "tail -n +2 {{.AUTH_UNIT}} >> {{.MERGED}}"
      - "tail -n +2 {{.AUTH_INT}} >> {{.MERGED}}"
      - "tail -n +2 {{.JO_UNIT}} >> {{.MERGED}}"
      - "tail -n +2 {{.JO_INT}} >> {{.MERGED}}"
      - go tool cover -html={{.MERGED}} -o {{.HTML}}
      - echo "Coverage profile -> {{.MERGED}}"
      - echo "HTML report      -> {{.HTML}}"