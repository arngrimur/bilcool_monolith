# Defaults for the bilcool chart. Environment specifics live in ../values-dev.yaml and ../values-prod.yaml;
# secrets live in ../values-secrets.yaml (gitignored, see ../values-secrets.example.yaml).

image:
  # Tag for all bilcool images (CI sets it to the release tag). Empty means "latest", which is what `task minikube:build` loads.
  tag: ""
  pullPolicy: IfNotPresent

# Pod-level hardening applied to the Go services (images run as uid 10001).
podSecurity:
  runAsUser: 10001

replicas:
  authentication: 2
  bookings: 2
  journal: 2
  eventLedger: 2
  ui: 1

config:
  awsRegion: eu-north-1
  # Empty means "real AWS" (no AWS_ENDPOINT_URL is set). Dev points this at LocalStack.
  awsEndpointUrl: ""
  # polling | replication. Undecided which one wins; both stay supported. replication needs wal_level=logical.
  outboxMode: polling
  authentication:
    webauthnRpId: ""
    webauthnRpOrigins: ""
    webauthnDisplayName: BilCool
    fromEmail: "security@areskiftet44.se"
    # brevo (mails the login code) | log (DEV ONLY: writes the login code to the authentication pod log)
    mailSender: brevo
  eventLedger:
    dynamoTableName: event-ledger

# LocalStack (SNS/SQS/DynamoDB stand-in). Dev only.
localstack:
  enabled: false
  image: localstack/localstack:2026.3.0

# In-cluster Postgres: ONE instance, database "bilcool", one schema + login role per service (mirrors Frostmoln).
postgres:
  enabled: false
  image: postgres:18
  storage: 1Gi
  # Grant REPLICATION to the service roles so OUTBOX_MODE=replication can be tried in dev.
  replicationRoles: false

# dbmate migrations (one Job per service, pre-install/pre-upgrade hook).
migrations:
  enabled: true

# Dev users inserted into authentication, bookings and journal. Never enable in prod.
seed:
  enabled: false
  users: []
  #  - username: someone
  #    email: someone@example.com
  #    role: admin

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  # tls: [{secretName: bilcool-tls, hosts: [bilcool.example.com]}]
  tls: []

# Set in values-secrets.yaml. DB URLs may be left empty when postgres.enabled: they are then derived from
# secrets.postgres.passwords.
secrets:
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  localstackAuthToken: ""
  postgres:
    adminPassword: ""
    passwords:
      bookings: ""
      authentication: ""
      journal: ""
  authentication:
    jwtSecret: ""
    brevoApiKey: ""
    databaseUrl: ""
  bookings:
    databaseUrl: ""
    # Optional. Without it bookings returns only the raw GPS track (no road-snapped route) and no road distance.
    mapboxAccessToken: ""
  journal:
    databaseUrl: ""
