apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookings-db
spec:
  serviceName: bookings-db
  replicas: 1
  selector:
    matchLabels:
      app: bookings-db
  template:
    metadata:
      labels:
        app: bookings-db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          args:
            - -c
            - wal_level=logical
            - -c
            - max_wal_senders=5
            - -c
            - max_replication_slots=5
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: bookings
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "bookings"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bookings-db
spec:
  selector:
    app: bookings-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
