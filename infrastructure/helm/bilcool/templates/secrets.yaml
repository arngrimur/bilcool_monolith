apiVersion: v1
kind: Secret
metadata:
  name: bookings
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.bookings.databaseUrl | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.bookings.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.bookings.awsSecretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: authentication
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.authentication.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.authentication.jwtSecret | quote }}
  BREVO_API_KEY: {{ .Values.secrets.authentication.brevoApiKey | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.authentication.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.authentication.awsSecretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: event-ledger
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.eventLedger.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.eventLedger.awsSecretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: journal
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.journal.databaseUrl | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.journal.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.journal.awsSecretAccessKey | quote }}
